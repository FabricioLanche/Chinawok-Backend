service: chinawok-usuarios

provider:
  name: aws
  runtime: python3.12
  memorySize: 512
  timeout: 300
  region: us-east-1
  stage: ${param:stage}
  
  environment:
    TABLE_USUARIOS: ${env:TABLE_USUARIOS, 'ChinaWok-Usuarios'}
    JWT_SECRET: ${env:JWT_SECRET, 'tu-clave-secreta-super-segura-cambiar-en-produccion'}
    JWT_EXPIRATION_HOURS: ${env:JWT_EXPIRATION_HOURS, '24'}

  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole
  
  layers:
    - ${cf:${self:provider.stage}-ChinaWok-Python-Dependencies-Layer}

package:
  patterns:
    - '!.git/**'
    - '!.vscode/**'
    - '!node_modules/**'
    - '!__pycache__/**'
    - '!*.pyc'
    - '!requirements.txt'
    - 'login/**'
    - 'usuarios/**'

functions:
  # ============================================================
  # AUTENTICACIÓN Y REGISTRO
  # ============================================================
  registrar:
    handler: login/registrarUsuario.lambda_handler
    name: ${self:service}-registrar
    description: Registrar un nuevo usuario
    events:
      - http:
          path: usuario/registrar
          method: post
          cors: true
          # Sin authorizer - endpoint público

  login:
    handler: login/loginUsuario.lambda_handler
    name: ${self:service}-login
    description: Iniciar sesión y obtener token JWT
    events:
      - http:
          path: usuario/login
          method: post
          cors: true
          # Sin authorizer - endpoint público

  # ============================================================
  # GESTIÓN DE USUARIOS (REQUIEREN AUTENTICACIÓN)
  # ============================================================
  listar:
    handler: usuarios/listarUsuario.lambda_handler
    name: ${self:service}-listar
    description: Listar todos los usuarios (solo Admin)
    events:
      - http:
          path: usuario/listar
          method: get
          cors: true
          authorizer:
            type: REQUEST
            identitySource: method.request.header.Authorization
            name: AuthorizerFunction
            resultTtlInSeconds: 0

  obtenerMiInfo:
    handler: usuarios/obtenerMiUsuario.lambda_handler
    name: ${self:service}-obtener-mi-info
    description: Obtener información del usuario autenticado o de otro usuario
    events:
      - http:
          path: usuario/mi-info
          method: get
          cors: true
          authorizer:
            type: REQUEST
            identitySource: method.request.header.Authorization
            name: AuthorizerFunction
            resultTtlInSeconds: 0

  buscar:
    handler: usuarios/buscarUsuario.lambda_handler
    name: ${self:service}-buscar
    description: Buscar usuario por correo
    events:
      - http:
          path: usuario/buscar
          method: post
          cors: true
          authorizer:
            type: REQUEST
            identitySource: method.request.header.Authorization
            name: AuthorizerFunction
            resultTtlInSeconds: 0

  editar:
    handler: usuarios/editarUsuario.lambda_handler
    name: ${self:service}-editar
    description: Editar información de un usuario
    events:
      - http:
          path: usuario/editar
          method: put
          cors: true
          authorizer:
            type: REQUEST
            identitySource: method.request.header.Authorization
            name: AuthorizerFunction
            resultTtlInSeconds: 0

  eliminar:
    handler: usuarios/eliminarUsuario.lambda_handler
    name: ${self:service}-eliminar
    description: Eliminar un usuario
    events:
      - http:
          path: usuario/eliminar
          method: delete
          cors: true
          authorizer:
            type: REQUEST
            identitySource: method.request.header.Authorization
            name: AuthorizerFunction
            resultTtlInSeconds: 0

resources:
  Resources:
    # Lambda Authorizer compartido
    AuthorizerFunction:
      Type: AWS::Lambda::Function
      Properties:
        FunctionName: ${self:service}-authorizer
        Runtime: python3.12
        Handler: index.lambda_handler
        Role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole
        Timeout: 30
        Layers:
          - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
        Environment:
          Variables:
            JWT_SECRET: ${env:JWT_SECRET}
            JWT_EXPIRATION_HOURS: ${env:JWT_EXPIRATION_HOURS, '24'}
        Code:
          ZipFile: |
            import json
            from utils.jwt_utils import validar_token
            
            def lambda_handler(event, context):
                """Lambda Authorizer con validación de JWT"""
                token = event.get("authorizationToken", "")
                
                if token.lower().startswith("bearer "):
                    token = token.split(" ", 1)[1].strip()
                
                resultado = validar_token(token)
                
                if not resultado.get("valido"):
                    raise Exception("Unauthorized")
                
                return {
                    "principalId": resultado["correo"],
                    "policyDocument": {
                        "Version": "2012-10-17",
                        "Statement": [
                            {
                                "Action": "execute-api:Invoke",
                                "Effect": "Allow",
                                "Resource": event["methodArn"]
                            }
                        ]
                    },
                    "context": {
                        "correo": resultado["correo"],
                        "role": resultado["role"],
                        "nombre": resultado["nombre"]
                    }
                }
