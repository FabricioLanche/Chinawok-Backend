service: chinawok-pedidos

provider:
  name: aws
  runtime: python3.12
  memorySize: 512
  timeout: 300
  region: us-east-1
  
  environment:
    TABLE_LOCALES: ${env:TABLE_LOCALES, 'ChinaWok-Locales'}
    TABLE_COMBOS: ${env:TABLE_COMBOS, 'ChinaWok-Combos'}
    TABLE_OFERTAS: ${env:TABLE_OFERTAS, 'ChinaWok-Ofertas'}
    TABLE_PEDIDOS: ${env:TABLE_PEDIDOS, 'ChinaWok-Pedidos'}
    TABLE_PRODUCTOS: ${env:TABLE_PRODUCTOS, 'ChinaWok-Productos'}
    TABLE_USUARIOS: ${env:TABLE_USUARIOS, 'ChinaWok-Usuarios'}
    TABLE_EMPLEADOS: ${env:TABLE_EMPLEADOS, 'ChinaWok-Empleados'}
    AWS_ACCOUNT_ID: ${env:AWS_ACCOUNT_ID}
    CHINAWOK_REGION: ${self:provider.region}
    STEP_FUNCTION_PEDIDOS_NAME: ${env:STEP_FUNCTION_PEDIDOS_NAME, 'ChinaWok-Pedidos-Processor'}
    EVENT_BUS_NAME: ${env:EVENT_BUS_NAME, 'chinawok-pedidos-events'}
    MODO_REALISTA: ${env:MODO_REALISTA, 'false'}

  layers:
    - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}

  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole

functions:
  # ==================== COMBOS ====================
  combosCrear:
    handler: combos/crearCombo.handler
    name: ${self:service}-combos-crear
    description: Crear un combo
    events:
      - http:
          path: combos
          method: post
          cors: true
  
  combosObtener:
    handler: combos/obtenerCombo.handler
    name: ${self:service}-combos-obtener
    description: Obtener combos por local
    events:
      - http:
          path: combos
          method: get
          cors: true
  
  combosEditar:
    handler: combos/editarCombo.handler
    name: ${self:service}-combos-editar
    description: Editar un combo
    events:
      - http:
          path: combos
          method: put
          cors: true
  
  combosEliminar:
    handler: combos/eliminarCombo.handler
    name: ${self:service}-combos-eliminar
    description: Eliminar un combo
    events:
      - http:
          path: combos
          method: delete
          cors: true
  
  # ==================== OFERTAS ====================
  ofertasCrear:
    handler: ofertas/crearOferta.handler
    name: ${self:service}-ofertas-crear
    description: Crear una oferta
    events:
      - http:
          path: ofertas
          method: post
          cors: true
  
  ofertasObtener:
    handler: ofertas/obtenerOferta.handler
    name: ${self:service}-ofertas-obtener
    description: Obtener ofertas por local
    events:
      - http:
          path: ofertas
          method: get
          cors: true
  
  ofertasEditar:
    handler: ofertas/editarOferta.handler
    name: ${self:service}-ofertas-editar
    description: Editar una oferta
    events:
      - http:
          path: ofertas
          method: put
          cors: true
  
  ofertasEliminar:
    handler: ofertas/eliminarOferta.handler
    name: ${self:service}-ofertas-eliminar
    description: Eliminar una oferta
    events:
      - http:
          path: ofertas
          method: delete
          cors: true
  
  # ==================== PEDIDOS ====================
  pedidosCrear:
    handler: pedidos/crearPedido.handler
    name: ${self:service}-pedidos-crear
    description: Crear un pedido
    events:
      - http:
          path: pedidos
          method: post
          cors: true
  
  pedidosObtener:
    handler: pedidos/obtenerPedido.handler
    name: ${self:service}-pedidos-obtener
    description: Obtener pedidos por local
    events:
      - http:
          path: pedidos
          method: get
          cors: true
  
  pedidosEditar:
    handler: pedidos/editarPedido.handler
    name: ${self:service}-pedidos-editar
    description: Editar un pedido
    events:
      - http:
          path: pedidos
          method: put
          cors: true
  
  pedidosEliminar:
    handler: pedidos/eliminarPedido.handler
    name: ${self:service}-pedidos-eliminar
    description: Eliminar un pedido
    events:
      - http:
          path: pedidos
          method: delete
          cors: true
  
  # ==================== PRODUCTOS ====================
  productosCrear:
    handler: productos/crearProducto.handler
    name: ${self:service}-productos-crear
    description: Crear un producto
    events:
      - http:
          path: productos
          method: post
          cors: true
  
  productosObtener:
    handler: productos/obtenerProducto.handler
    name: ${self:service}-productos-obtener
    description: Obtener productos por local
    events:
      - http:
          path: productos
          method: get
          cors: true
  
  productosEditar:
    handler: productos/editarProducto.handler
    name: ${self:service}-productos-editar
    description: Editar un producto
    events:
      - http:
          path: productos
          method: put
          cors: true
  
  productosEliminar:
    handler: productos/eliminarProducto.handler
    name: ${self:service}-productos-eliminar
    description: Eliminar un producto
    events:
      - http:
          path: productos
          method: delete
          cors: true

  # ==================== WORKFLOW - STEP FUNCTIONS ====================
  workflowIniciar:
    handler: worflow/iniciarWorkflow.handler
    name: ${self:service}-workflow-iniciar
    description: Iniciar el workflow de procesamiento de pedidos
  
  workflowStepConfirmar:
    handler: worflow/stepConfirmar.handler
    name: ${self:service}-workflow-step-confirmar
    description: Step 1 - Confirmar pedido
  
  workflowStepCocinar:
    handler: worflow/stepCocinar.handler
    name: ${self:service}-workflow-step-cocinar
    description: Step 2 - Cocinar pedido
  
  workflowStepEmpacar:
    handler: worflow/stepEmpacar.handler
    name: ${self:service}-workflow-step-empacar
    description: Step 3 - Empacar pedido
  
  workflowStepEnviar:
    handler: worflow/stepEnviar.handler
    name: ${self:service}-workflow-step-enviar
    description: Step 4 - Enviar pedido
  
  workflowConfirmarRecepcion:
    handler: worflow/confirmarRecepcion.handler
    name: ${self:service}-workflow-confirmar-recepcion
    description: Step 5 - Confirmar recepción del pedido
  
  workflowLiberarPedido:
    handler: worflow/liberarPedido.handler
    name: ${self:service}-workflow-liberar-pedido
    description: Liberar empleados asignados al pedido
  
  workflowNotificarUsuario:
    handler: worflow/notificarUsuario.handler
    name: ${self:service}-workflow-notificar-usuario
    description: Notificar usuario sobre el estado del pedido

resources:
  Resources:
    # EventBridge Event Bus
    ChinaWokEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${env:EVENT_BUS_NAME, 'chinawok-pedidos-events'}

    # EventBridge Rule para PedidoCreado
    PedidoCreadoEventRule:
      Type: AWS::Events::Rule
      Properties:
        Name: ${self:service}-pedido-creado-rule
        Description: Regla para enviar pedidos creados al Step Function
        EventBusName: !Ref ChinaWokEventBus
        EventPattern:
          source:
            - chinawok.pedidos
          detail-type:
            - PedidoCreado
        State: ENABLED
        Targets:
          - Arn: !GetAtt ChinaWokPedidosStateMachine.Arn
            Id: PedidoCreadoStepFunction
            RoleArn: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole

    # Step Functions State Machine
    ChinaWokPedidosStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: ${env:STEP_FUNCTION_PEDIDOS_NAME, 'ChinaWok-Pedidos-Processor'}
        RoleArn: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole
        DefinitionString:
          Fn::Sub: |
            {
              "Comment": "Workflow de procesamiento de pedidos ChinaWok",
              "StartAt": "StepConfirmar",
              "States": {
                "StepConfirmar": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-step-confirmar",
                  "Next": "StepCocinar",
                  "Retry": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "NotificarError"
                    }
                  ]
                },
                "StepCocinar": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-step-cocinar",
                  "Next": "StepEmpacar",
                  "Retry": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "NotificarError"
                    }
                  ]
                },
                "StepEmpacar": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-step-empacar",
                  "Next": "StepEnviar",
                  "Retry": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "NotificarError"
                    }
                  ]
                },
                "StepEnviar": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-step-enviar",
                  "Next": "ConfirmarRecepcion",
                  "Retry": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "NotificarError"
                    }
                  ]
                },
                "ConfirmarRecepcion": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-confirmar-recepcion",
                  "Next": "LiberarPedido",
                  "Retry": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "NotificarError"
                    }
                  ]
                },
                "LiberarPedido": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-liberar-pedido",
                  "Next": "NotificarExito",
                  "Retry": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "IntervalSeconds": 2,
                      "MaxAttempts": 3,
                      "BackoffRate": 2
                    }
                  ],
                  "Catch": [
                    {
                      "ErrorEquals": ["States.ALL"],
                      "Next": "NotificarError"
                    }
                  ]
                },
                "NotificarExito": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-notificar-usuario",
                  "End": true
                },
                "NotificarError": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-workflow-notificar-usuario",
                  "End": true
                }
              }
            }

  Outputs:
    EventBusName:
      Description: Nombre del Event Bus de ChinaWok
      Value: !Ref ChinaWokEventBus
      Export:
        Name: ChinaWok-EventBus-Name
    
    EventBusArn:
      Description: ARN del Event Bus de ChinaWok
      Value: !GetAtt ChinaWokEventBus.Arn
      Export:
        Name: ChinaWok-EventBus-Arn
    
    StateMachineArn:
      Description: ARN del Step Function de procesamiento de pedidos
      Value: !GetAtt ChinaWokPedidosStateMachine.Arn
      Export:
        Name: ChinaWok-Pedidos-StateMachine-Arn

package:
  individually: false
  exclude:
    - node_modules/**
    - .git/**
    - .env
    - __pycache__/**
    - "*.pyc"