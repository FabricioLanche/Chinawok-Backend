org: flanche
service: chinawok-analitica

provider:
  name: aws
  runtime: python3.12
  memorySize: 512
  timeout: 300
  region: us-east-1
  
  environment:
    # Variables para Analítica
    ATHENA_DATABASE: ${env:ATHENA_DATABASE, 'chinawok_analytics'}
    ATHENA_OUTPUT_LOCATION: ${env:ATHENA_OUTPUT_LOCATION}
    ATHENA_WORKGROUP: ${env:ATHENA_WORKGROUP, 'primary'}
    # Variables para Ingesta
    S3_BUCKET_NAME: ${env:S3_BUCKET_NAME}
    TABLE_LOCALES: ${env:TABLE_LOCALES}
    TABLE_USUARIOS: ${env:TABLE_USUARIOS}
    TABLE_PRODUCTOS: ${env:TABLE_PRODUCTOS}
    TABLE_EMPLEADOS: ${env:TABLE_EMPLEADOS}
    TABLE_COMBOS: ${env:TABLE_COMBOS}
    TABLE_PEDIDOS: ${env:TABLE_PEDIDOS}
    TABLE_OFERTAS: ${env:TABLE_OFERTAS}
    TABLE_RESENAS: ${env:TABLE_RESENAS}
  
  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole

functions:
  # ============================================================
  # FUNCIONES DE ANALÍTICA
  # ============================================================
  productosVendidos:
    handler: analitica/productos_vendidos.handler
    name: ${self:service}-productos-vendidos
    description: Consulta los productos más vendidos por local
    layers:
      - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
    events:
      - http:
          path: analitica/productos-vendidos
          method: post
          cors: true
  
  mejorPersonal:
    handler: analitica/mejor_personal.handler
    name: ${self:service}-mejor-personal
    description: Ranking del mejor personal por local
    layers:
      - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
    events:
      - http:
          path: analitica/mejor-personal
          method: post
          cors: true
  
  recordDiario:
    handler: analitica/record_diario.handler
    name: ${self:service}-record-diario
    description: Récord diario de pedidos y revenue por mes
    layers:
      - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
    events:
      - http:
          path: analitica/record-diario
          method: post
          cors: true
  
  estadisticasGenerales:
    handler: analitica/estadisticas_generales.handler
    name: ${self:service}-estadisticas-generales
    description: Dashboard con estadísticas generales del local
    layers:
      - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
    events:
      - http:
          path: analitica/estadisticas-generales
          method: post
          cors: true

  # ============================================================
  # FUNCIONES DE INGESTA
  # ============================================================
  ingestTable:
    handler: ingesta/ingest_table.handler
    name: ${self:service}-ingest-table
    description: Ingesta datos de una tabla específica de DynamoDB a S3
    layers:
      - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
    events:
      - http:
          path: ingest/{tableName}
          method: post
          cors: true
          request:
            parameters:
              paths:
                tableName: true
  
  ingestAllTables:
    handler: ingesta/ingest_all_tables.handler
    name: ${self:service}-ingest-all-tables
    description: Ingesta datos de todas las tablas de DynamoDB a S3
    layers:
      - ${cf:chinawok-shared-layer-dev.PythonDependenciesLayerExport}
    events:
      - http:
          path: ingest/all
          method: post
          cors: true
      - schedule:
          rate: cron(0 2 * * ? *)
          enabled: false
          description: Ejecuta ingesta diaria a las 2 AM UTC

package:
  individually: false
  exclude:
    - node_modules/**
    - .git/**
    - .env
    - __pycache__/**
    - "*.pyc"
    - "**/requirements.txt"
