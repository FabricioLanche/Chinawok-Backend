service: chinawok-shared-layer

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${param:stage}
  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole

layers:
  pythonDependencies:
    path: python
    name: ${self:provider.stage}-chinawok-python-dependencies
    description: Dependencias Python y utilidades compartidas
    compatibleRuntimes:
      - python3.12
      - python3.13
    retain: false

# NO especificar package.patterns - dejar que suba TODO
# Serverless debería incluir todo en python/ por defecto

resources:
  Outputs:
    PythonDependenciesLayerExport:
      Description: ARN del Lambda Layer compartido
      Value:
        Ref: PythonDependenciesLambdaLayer
      Export:
        Name: ${self:provider.stage}-chinawok-python-dependencies-layer

resources:
  Outputs:
    PythonDependenciesLayerExport:
      Description: ARN del Lambda Layer compartido
      Value:
        Ref: PythonDependenciesLambdaLayer
      Export:
        Name: ${self:provider.stage}-chinawok-python-dependencies-layer
