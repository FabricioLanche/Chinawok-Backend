service: chinawok-shared-layer

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${param:stage}
  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/LabRole

layers:
  pythonDependencies:
    path: python
    name: ${self:provider.stage}-chinawok-python-dependencies
    description: Dependencias Python y utilidades compartidas para todos los microservicios ChinaWok
    compatibleRuntimes:
      - python3.12
      - python3.13
    retain: false

package:
  patterns:
    # IMPORTANTE: Incluir explícitamente todo el contenido de python/
    - 'python/**'
    # Excluir archivos innecesarios
    - '!python/**/__pycache__/**'
    - '!python/**/*.pyc'
    - '!python/**/.pytest_cache/**'
    - '!.serverless/**'
    - '!node_modules/**'
